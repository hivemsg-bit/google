<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact • CA Mock</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">CA Mock</a>
      <nav>
        <a href="pricing.html">Pricing</a>
        <a href="tests.html">Tests</a>
      </nav>
    </div>
  </header>

  <section class="container narrow">
    <div class="card">
      <h2>Contact us</h2>
      <form id="contactForm" class="stack">
        <label>Name
          <input type="text" id="cName" required>
        </label>
        <label>Email
          <input type="email" id="cEmail" required>
        </label>
        <label>Message
          <textarea id="cMsg" rows="5" required></textarea>
        </label>
        <button class="btn" type="submit">Send</button>
        <a class="btn outline block" id="waBtn" target="_blank" href="https://wa.me/919999999999">WhatsApp</a>
      </form>
    </div>
  </section>
</body>
</html>
