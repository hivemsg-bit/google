<div class="payment-methods">
    <div class="payment-option">
        <h4>Pay via UPI</h4>
        <div class="qr-code">
            <!-- Apna UPI QR code yahan add karein -->
            <img src="your-upi-qr-code.png" alt="Scan to Pay" width="200">
        </div>
        <p>Scan QR code with any UPI app</p>
        <div class="upi-id">
            <strong>UPI ID: yournumber@paytm</strong>
            <button onclick="copyUPI()">Copy UPI ID</button>
        </div>
        <form class="payment-verification">
            <label>After payment, enter UTR Number:</label>
            <input type="text" id="utrNumber" placeholder="Enter UTR/Transaction ID">
            <button type="button" onclick="verifyPayment()">Verify Payment</button>
        </form>
    </div>
</div>
